[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "michicheck"
version = "0.3.0"
description = "MichiCheck - MichiCheck - continuidad de la ruta hematologica pediatrica con tamizaje optico no invasivo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Equipo MichiCheck - Hackaton Nino San Borja 2026" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
