[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yawar"
version = "0.1.0"
description = "Yawar Nan - Tamizaje optico no invasivo de neutropenia severa y ruta hematologica pediatrica"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Equipo Yawar Nan - Hackaton Nino San Borja 2026" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5"]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[project.scripts]
yawar = "yawar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Permite ejecutar la suite sin instalar el paquete, que es como la correran
# los evaluadores al clonar el repositorio.
pythonpath = ["src"]
